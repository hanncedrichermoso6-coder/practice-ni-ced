<!DOCTYPE html>
<html>
<head>
    <title>CEDRIC POGI // SYSTEM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #020202;
            color: #00ff9d;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(#00ff9d12 1px, transparent 1px),
                linear-gradient(90deg, #00ff9d12 1px, transparent 1px);
            background-size: 40px 40px;
            animation: grid 5s linear infinite;
            z-index: -1;
        }

        @keyframes grid {
            from { transform: translateY(0); }
            to { transform: translateY(40px); }
        }

        .box {
            width: 90%;
            max-width: 650px;
            padding: 40px 25px;
            text-align: center;
            border: 1px solid #00ff9d;
            background: #020202ee;
            box-shadow: 0 0 30px #00ff9d55;
        }

        .status {
            font-size: 13px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(40px, 10vw, 70px);
            margin: 10px 0;
            letter-spacing: 6px;
            text-shadow:
                0 0 5px #00ff9d,
                0 0 20px #00ff9d,
                0 0 40px #00ff9d;
        }

        h2 {
            color: white;
            letter-spacing: 12px;
            margin-top: 10px;
        }

        button {
            margin-top: 25px;
            padding: 15px 40px;
            background: transparent;
            border: 1px solid #00ff9d;
            color: #00ff9d;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #00ff9d;
            color: black;
            box-shadow: 0 0 30px #00ff9d;
        }

        #profile {
            display: none;
            margin-top: 30px;
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #profile img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #00ff9d;
            box-shadow:
                0 0 15px #00ff9d,
                0 0 40px #00ff9d55;
        }

        .name {
            margin-top: 20px;
            font-size: 25px;
            color: white;
            text-shadow: 0 0 10px white;
        }

        .subtitle {
            margin-top: 8px;
            color: #00ff9d;
        }

        #terminal {
            margin-top: 20px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="status">
            [ ● ] SYSTEM ONLINE
        </div>

        <h1>CEDRIC POGI</h1>

        <h2>PALAUTOG</h2>

        <div id="terminal">
            > ACCESS REQUIRED...
        </div>

        <button onclick="enterSystem()">
            [ ENTER ]
        </button>

        <div id="profile">

            <img src="me.jpg" alt="Cedric">

            <div class="name">
                CEDRIC POGI
            </div>

            <div class="subtitle">
                // PALAUTOG
            </div>

        </div>

    </div>

    <script>

        function enterSystem() {

            document.getElementById("terminal").innerHTML =
                "> ACCESS GRANTED...";

            document.querySelector("button").style.display =
                "none";

            document.getElementById("profile").style.display =
                "block";
        }

    </script>

</body>
</html>
